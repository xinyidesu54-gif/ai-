<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI 工业安全 · AI 산업안전 · AI Industrial Safety</title>
<style>
:root{--bg:#f4f7fb;--surface:#fff;--text:#18202b;--muted:#566272;--accent:#0b7285;--on:#fff;--border:#d9e1ea;--warn:#e8590c;--ok:#2b8a3e;--bad:#c92a2a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1419;--surface:#1a212a;--text:#e8edf2;--muted:#9aa6b4;--accent:#3bc9db;--on:#0b1114;--border:#2c3745;--warn:#ff922b;--ok:#69db7c;--bad:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1419;--surface:#1a212a;--text:#e8edf2;--muted:#9aa6b4;--accent:#3bc9db;--on:#0b1114;--border:#2c3745;--warn:#ff922b;--ok:#69db7c;--bad:#ff6b6b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Malgun Gothic","Apple SD Gothic Neo","Microsoft YaHei","Noto Sans SC","Noto Sans KR",sans-serif;line-height:1.7}
.top{height:8px;background:linear-gradient(90deg,var(--accent),var(--warn))}
.lang{max-width:960px;margin:0 auto;padding:14px 20px 0;display:flex;gap:8px;justify-content:flex-end}
.lang button{font:inherit;font-size:14px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:4px 14px;cursor:pointer}
.lang button.on{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}
header{max-width:960px;margin:0 auto;padding:16px 20px 12px}
header h1{font-size:clamp(26px,6vw,42px);margin:0 0 8px;line-height:1.25}
header p{color:var(--muted);margin:0;max-width:660px}
main{max-width:960px;margin:0 auto;padding:0 20px 40px}
h2{font-size:22px;margin:36px 0 14px;border-left:6px solid var(--accent);padding-left:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:0;color:var(--muted);font-size:15px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:s}
.step{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative}
.step:before{counter-increment:s;content:counter(s);display:inline-block;background:var(--accent);color:var(--on);border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;font-weight:700;margin-bottom:6px}
.step b{display:block}.step span{color:var(--muted);font-size:14px}
.demo{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.demo label{display:flex;gap:10px;align-items:center;padding:8px 0;cursor:pointer;border-bottom:1px solid var(--border)}
.demo input{width:20px;height:20px;accent-color:var(--accent)}
.meter{height:16px;background:var(--border);border-radius:8px;overflow:hidden;margin:16px 0 8px}
.meter>div{height:100%;width:0;transition:width .3s,background .3s}
.lvl{font-size:20px;font-weight:700}
.note{color:var(--muted);font-size:13px;margin-top:8px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:8px 20px 28px}
</style>
</head>
<body>
<div class="top"></div>
<div class="lang" id="lang"></div>
<header><h1 id="title"></h1><p id="sub"></p></header>
<main id="app"></main>
<footer id="foot"></footer>
<script>
var T={
zh:{t:'🤖 AI 工业安全',s:'用视觉识别、传感器数据与预测模型，把事故预防从“事后处理”变为“事前预警”。',
h:['典型应用场景','AI 安全系统如何工作','风险评分演示','局限与负责任使用'],
ap:[['👁️ 视觉识别','摄像头自动检测未戴安全帽、闯入危险区、吸烟明火等违规行为并实时告警。'],['🔧 预测性维护','分析振动、温度、电流数据，在设备故障前发出预警，减少突发事故。'],['⌚ 可穿戴设备','监测心率、疲劳、跌倒与有毒气体浓度，异常时提醒本人与班组长。'],['🧪 异常检测','识别压力、流量、温度的异常模式，提前发现泄漏与过载。'],['📋 智能风险评估','大语言模型辅助起草作业风险分析、检索规程与历史事故案例。'],['🏭 数字孪生','在虚拟工厂中模拟事故与疏散，优化布局和应急预案。']],
st:[['采集','摄像头、传感器、PLC 与工单数据'],['分析','模型识别违规、异常与风险趋势'],['预警','分级推送声光、短信或看板告警'],['闭环','人工确认处置，结果回流优化模型']],
dm:['勾选当前现场状况：','未佩戴安全帽','人员进入设备危险区','设备振动异常升高','作业人员疲劳（连续作业超 10 小时）','环境气体浓度超标'],
lv:['低风险','中风险','高风险'],ac:['继续常规巡检','通知班组长，现场确认','立即停机并疏散，启动应急预案'],sc:'风险指数',
dn:'说明：演示为简化规则，仅用于示意评分思路，真实系统需结合现场数据与专业评估。',
lm:[['误报与漏报','模型并非完美，关键决策须由人确认，并设置人工复核。'],['隐私与合规','视频与人员数据需最小化采集，明确告知并遵守当地法规。'],['数据质量','传感器校准、光照与遮挡都会影响效果，需持续验证。'],['不替代管理','AI 是辅助工具，培训、规程与安全文化仍是根本。']],
f:'本页为通用科普信息，实际部署请遵循企业规程、法规及专业评估。'},
ko:{t:'🤖 AI 산업안전',s:'영상 인식, 센서 데이터, 예측 모델로 사고 예방을 사후 대응에서 사전 경보로 전환합니다.',
h:['대표 적용 분야','AI 안전 시스템의 작동 방식','위험도 점수 데모','한계와 책임 있는 활용'],
ap:[['👁️ 영상 인식','카메라가 안전모 미착용, 위험구역 침입, 화기 사용 등을 자동 감지해 실시간 경보.'],['🔧 예지 정비','진동·온도·전류 데이터를 분석해 고장 전에 경고, 돌발 사고 감소.'],['⌚ 웨어러블','심박, 피로, 넘어짐, 유해가스 농도를 모니터링하고 이상 시 본인과 반장에게 알림.'],['🧪 이상 탐지','압력·유량·온도의 이상 패턴을 찾아 누출과 과부하를 조기 발견.'],['📋 스마트 위험성평가','대규모 언어모델로 작업 위험분석 초안, 규정 검색, 과거 사고 사례 조회 지원.'],['🏭 디지털 트윈','가상 공장에서 사고와 대피를 시뮬레이션해 배치와 비상계획을 개선.']],
st:[['수집','카메라, 센서, PLC, 작업지시 데이터'],['분석','모델이 위반·이상·위험 추세를 식별'],['경보','단계별 음향·문자·대시보드 알림'],['환류','사람이 조치 확인, 결과로 모델 개선']],
dm:['현재 현장 상태를 선택하세요:','안전모 미착용','설비 위험구역 내 작업자 진입','설비 진동 이상 상승','작업자 피로(10시간 이상 연속 작업)','주변 가스 농도 기준 초과'],
lv:['낮음','보통','높음'],ac:['정기 순찰 유지','반장에게 알리고 현장 확인','즉시 설비 정지·대피, 비상계획 가동'],sc:'위험 지수',
dn:'참고: 데모는 단순화된 규칙으로 점수 산정 개념만 보여 줍니다. 실제 시스템은 현장 데이터와 전문가 평가가 필요합니다.',
lm:[['오탐·미탐','모델은 완벽하지 않으므로 핵심 판단은 사람이 확인하고 재검토 절차를 둡니다.'],['개인정보·규정 준수','영상과 인원 데이터는 최소한으로 수집하고 고지하며 현지 법규를 따릅니다.'],['데이터 품질','센서 보정, 조명, 가림 현상이 성능에 영향을 주므로 지속적으로 검증합니다.'],['관리를 대체하지 않음','AI는 보조 도구이며 교육, 절차, 안전 문화가 근본입니다.']],
f:'본 페이지는 일반 정보이며, 실제 도입 시 사업장 규정, 법규 및 전문가 평가를 따르십시오.'},
en:{t:'🤖 AI for Industrial Safety',s:'Using vision, sensor data and predictive models to move accident prevention from reacting to warning ahead.',
h:['Typical Use Cases','How an AI Safety System Works','Risk Score Demo','Limits and Responsible Use'],
ap:[['👁️ Computer vision','Cameras detect missing hard hats, zone intrusions and open flames, and alert in real time.'],['🔧 Predictive maintenance','Vibration, temperature and current data flag failing equipment before it breaks.'],['⌚ Wearables','Track heart rate, fatigue, falls and toxic gas levels, alerting the worker and supervisor.'],['🧪 Anomaly detection','Spot unusual pressure, flow or temperature patterns to catch leaks and overloads early.'],['📋 Smart risk assessment','LLMs help draft job hazard analyses, retrieve procedures and find past incident cases.'],['🏭 Digital twin','Simulate accidents and evacuations in a virtual plant to improve layout and emergency plans.']],
st:[['Collect','Cameras, sensors, PLC and work-order data'],['Analyze','Models identify violations, anomalies and risk trends'],['Alert','Tiered sound, SMS or dashboard alerts'],['Close the loop','People confirm actions; outcomes retrain the model']],
dm:['Tick the conditions on site:','No hard hat worn','Person inside machine danger zone','Abnormal rise in equipment vibration','Worker fatigue (over 10 hours continuous)','Ambient gas level above limit'],
lv:['Low risk','Medium risk','High risk'],ac:['Continue routine rounds','Notify supervisor and verify on site','Stop equipment and evacuate; activate emergency plan'],sc:'Risk index',
dn:'Note: this demo uses simplified rules to illustrate scoring only. Real systems need site data and professional assessment.',
lm:[['False alarms and misses','Models are imperfect: keep a human in the loop for critical decisions, with review procedures.'],['Privacy and compliance','Collect minimal video and personal data, inform workers, and follow local law.'],['Data quality','Sensor calibration, lighting and occlusion affect accuracy and need ongoing validation.'],['Not a substitute for management','AI assists; training, procedures and safety culture remain the foundation.']],
f:'General educational information. Follow your company procedures, regulations and professional assessment when deploying.'}
};
var W=[25,30,20,10,35];
var LN={zh:'中文',ko:'한국어',en:'English'},cur='zh';
try{var sv=localStorage.getItem('lang2');if(sv&&T[sv])cur=sv}catch(e){}
function cards(a){return '<div class="grid">'+a.map(function(x){return '<div class="card"><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>'}).join('')+'</div>'}
function render(){
var d=T[cur];document.documentElement.lang=cur==='zh'?'zh-CN':cur;
document.title=d.t.replace('🤖 ','');
document.getElementById('title').textContent=d.t;document.getElementById('sub').textContent=d.s;document.getElementById('foot').textContent=d.f;
document.getElementById('lang').innerHTML=Object.keys(LN).map(function(k){return '<button data-l="'+k+'"'+(k===cur?' class="on"':'')+'>'+LN[k]+'</button>'}).join('');
var h='<h2>'+d.h[0]+'</h2>'+cards(d.ap)+
'<h2>'+d.h[1]+'</h2><div class="steps">'+d.st.map(function(x){return '<div class="step"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'}).join('')+'</div>'+
'<h2>'+d.h[2]+'</h2><div class="demo" id="demo"><div style="color:var(--muted);margin-bottom:4px">'+d.dm[0]+'</div>'+
W.map(function(w,i){return '<label><input type="checkbox">'+d.dm[i+1]+'</label>'}).join('')+
'<div class="meter"><div id="mt"></div></div><div class="lvl" id="lv"></div><div id="ac" style="color:var(--muted)"></div><div class="note">'+d.dn+'</div></div>'+
'<h2>'+d.h[3]+'</h2>'+cards(d.lm);
document.getElementById('app').innerHTML=h;
var bx=document.querySelectorAll('#demo input');
function u(){var s=0;bx.forEach(function(b,i){if(b.checked)s+=W[i]});if(s>100)s=100;
var k=s>=60?2:s>=30?1:0,c=['var(--ok)','var(--warn)','var(--bad)'][k];
var m=document.getElementById('mt');m.style.width=Math.max(s,3)+'%';m.style.background=c;
var l=document.getElementById('lv');l.textContent=d.sc+' '+s+' · '+d.lv[k];l.style.color=c;
document.getElementById('ac').textContent=d.ac[k]}
bx.forEach(function(b){b.addEventListener('change',u)});u();
}
document.getElementById('lang').addEventListener('click',function(e){var l=e.target.getAttribute('data-l');if(!l)return;cur=l;try{localStorage.setItem('lang2',l)}catch(x){}render()});
render();
</script>
</body>
</html>
